<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none" role="img" aria-label="BeTheYou Logo">
  <!-- Minimalist Growth Icon -->
  <g transform="translate(4, 10)">
    <!-- Outer Growth Ring Arc (Teal) -->
    <path d="M28 6 A22 22 0 1 1 6 28" stroke="#397C78" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Inner Rising Arc (Gold) -->
    <path d="M28 17 A11 11 0 1 1 17 28" stroke="#D6AE64" stroke-width="4" stroke-linecap="round"/>
    <!-- Focus Core Point -->
    <circle cx="28" cy="28" r="4" fill="#397C78"/>
  </g>
  
  <!-- Wordmark Text -->
  <g transform="translate(74, 12)">
    <text x="0" y="32" font-family="'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em" fill="#202522">
      BE<tspan font-weight="400" fill="#737873">The</tspan><tspan fill="#397C78" font-weight="800">YOU</tspan>
    </text>
    <text x="1" y="49" font-family="'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.28em" fill="#737873">
      BE. BUILD. BECOME.
    </text>
  </g>
</svg>
